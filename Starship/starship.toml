palette = "dracula"

format = "$username$os$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$custom$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$shell$character"

[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

[character]
error_symbol = "[λ](bold red)"
success_symbol = "[λ](bold green)"

[shell]
disabled = false
format = "[$indicator]($style)"
style = "bold cyan"
pwsh_indicator = "[ ](bold orange)"
powershell_indicator = "[ ](bold orange)"
fish_indicator = ""
bash_indicator = ""
zsh_indicator = ""

[cmd_duration]
style = "bold yellow"
format = "[󱎫 $duration]($style) "
min_time = 500
show_milliseconds = true

[status]
disabled = false
style = "bold red"
symbol = "󰅙 "
not_executable_symbol = "󰒃 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰜺 "
signal_symbol = "󱐋 "
map_symbol = true
pipestatus = true
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '

[sudo]
disabled = false
style = "bold orange"
symbol = "󰌆 "
format = "[$symbol]($style)"

[jobs]
format = "[$symbol$number]($style) "
style = "bold yellow"
symbol = "✦"
threshold = 1
symbol_threshold = 1
number_threshold = 2
disabled = false

[username]
format = '［[$user]($style)］'
style_user = 'bold purple'
disabled = false
show_always = true

[time]
disabled = false
time_format = "[%R]"
style = "bold comment"
format = '  [ $time]($style) '

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Desktop" = "🖥"
"Music" = " "
"Pictures" = " "


[aws]
symbol = " "
style = "bold orange"
disabled = true

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
read_only_style = "bold red"
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = ""
truncate_to_repo = true
repo_root_style = "bold pink"

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "
style = "bold orange"
format = " [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "[󰩈 $count](bold red) "
ahead = "[󰁝$count](bold green) "
behind = "[󰁅$count](bold yellow) "
diverged = "[󰹹$ahead_count/$behind_count](bold pink) "
untracked = "[?$count](bold comment) "
stashed = "[󰓦 $count](bold cyan) "
modified = "[!$count](bold yellow) "
staged = "[+$count](bold green) "
renamed = "[»$count](bold purple) "
deleted = "[✘$count](bold red) "

[git_state]
style = "bold pink"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "
ssh_only = true
format = '[@](bold green)[$hostname](bold purple)[$ssh_symbol](bold orange)'
disabled = false

[java]
